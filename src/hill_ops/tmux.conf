# hill-ops's own tmux: no status line, no prefix, nothing from ~/.tmux.conf.
set -g status off
set -g prefix None
set -g prefix2 None
unbind -a -T prefix
set -g mouse on
set -g escape-time 10
set -g set-clipboard on
set -g focus-events on
set -g default-terminal tmux-256color
# Every pane may draw in true colour: over ssh, COLORTERM doesn't come
# along, and apps would round their colours to the 256. tmux 3.7 sets it
# itself, 3.4 doesn't. tmux converts colours down for a terminal that
# can't show them.
set-environment -g COLORTERM truecolor
set -g mode-keys emacs
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=brightblack
set -g @hill-height 1

# No right-click menus and no swapping panes with Ctrl-click: the layout is
# hill-ops's.
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
unbind -n C-MouseDown1Pane

# Dragging a border resizes the panes beside it, as tmux does; once the drag
# ends (@hill-dragging back to 0), hill-ops snaps the widths to its Layout
# settings and saves them. A drag can end over a pane rather than the
# border; a drag that didn't start on a border goes to the pane.
bind -n MouseDrag1Border 'resize-pane -M ; set -g @hill-dragging 1'
bind -n MouseDragEnd1Border 'set -g @hill-dragging 0'
bind -n MouseDragEnd1Pane if -F '#{@hill-dragging}' 'set -g @hill-dragging 0' 'send -M'

# A click on the strip's line reaches it without taking the focus from the
# app; a click on the strip grown, such as the panel, takes the focus.
# A double or triple click goes to the pane as it is, without selecting it,
# so it can't take the focus either; a program that doesn't use the mouse,
# such as a shell, no longer selects a word or a line with it.
bind -n MouseDown1Pane if -F '#{&&:#{==:#{pane_id},#{@hill-strip}},#{==:#{@hill-height},1}}' 'send -M -t =' 'select-pane -t = ; send -M -t ='
unbind -n DoubleClick1Pane
unbind -n TripleClick1Pane
